<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Observatoire des risques</title>
<script>
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var repo = parts.length ? '/' + parts[0] + '/' : '/';
  location.replace(location.origin + repo);
})();
</script>
</head>

</html>
